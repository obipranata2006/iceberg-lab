services:
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    depends_on:
      - iceberg-rest
      - minio
    networks:
      - iceberg_net
    volumes:
      - ./notebooks:/home/iceberg/notebooks/notebooks
      - ./sql:/home/iceberg/sql
    environment:
      - AWS_ACCESS_KEY_ID=obi
      - AWS_SECRET_ACCESS_KEY=42430003
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888"
      - "8080:8080"
      - "10000:10000"
      - "10001:10001"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: iceberg-rest
    depends_on:
      - minio
    networks:
      iceberg_net:
        aliases:
          - rest
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=obi
      - AWS_SECRET_ACCESS_KEY=42430003
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000

  minio:
    image: bitnamilegacy/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=obi
      - MINIO_ROOT_PASSWORD=42430003
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - "9000:9000"
      - "9001:9001"

  mc:
    image: bitnamilegacy/minio-client
    container_name: mc
    depends_on:
      - minio
    networks:
      - iceberg_net
    entrypoint: >
      /bin/sh -c "
      until (mc alias set minio http://minio:9000 obi 42430003) do echo 'waiting for minio...' && sleep 1; done;
      mc mb --ignore-existing minio/warehouse;
      mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

networks:
  iceberg_net: